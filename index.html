<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام إدارة المجلة</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f9;--card:#fff;--ink:#1a2040;--mut:#5a6283;--ac:#1f2c8f;--ac2:#e8ebf8;--bd:#cdd3e6;--rd:#a33a2c;--gd:#b8901f}
*{box-sizing:border-box}
body{font-family:Cairo,Tahoma,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink);line-height:1.6}
header{background:linear-gradient(90deg,#1f2c8f,#0b1a6b);border-bottom:4px solid var(--gd);color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
nav{display:flex;gap:4px;padding:8px 20px 0;border-bottom:2px solid var(--bd);flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button.on{color:var(--ac);border-color:var(--ac)}
main{padding:18px 20px;max-width:1200px;margin:auto}
h3{margin:18px 0 8px;font-size:17px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;background:var(--card);padding:14px;border:1px solid var(--bd);border-radius:6px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:4px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{font:inherit;cursor:pointer}
.b{background:var(--ac);color:#fff;border:0;padding:8px 18px;border-radius:4px;font-weight:600;margin:10px 0 0}
.b2{background:var(--ac2);color:var(--ac);border:1px solid var(--ac);padding:5px 14px;border-radius:4px;font-weight:600;margin:6px 0}
.hb{background:#ffffff22;color:#fff;border:1px solid #ffffff66;padding:5px 12px;border-radius:4px}
.sc{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
td:nth-child(2){white-space:normal;min-width:180px}
th{background:var(--ac2);color:var(--ac)}
td input{width:80px}
.dl{color:var(--rd);background:none;border:0;font-weight:600}
.ed{color:var(--ac);background:none;border:0;font-weight:600}
.lg{max-width:340px;margin:12vh auto;background:var(--card);padding:24px;border:1px solid var(--bd);border-radius:8px}
.lg label{margin-bottom:10px}
.nt{font-size:13px;color:var(--mut);margin:6px 0}

.lo{width:54px;height:54px;border-radius:50%;background:#fff;object-fit:cover}
header h1 small{display:block;font-size:12px;font-weight:400;opacity:.85}
.lg label{text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.cd{background:#fff;border:1px solid var(--bd);border-top:4px solid var(--ac);border-radius:6px;padding:10px 14px}
.cd.gd{border-top-color:var(--gd)}.cd b{display:block;font-size:24px;color:var(--ac)}.cd span{font-size:13px;color:var(--mut)}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.pn{background:#fff;border:1px solid var(--bd);border-radius:6px;padding:4px 14px 12px}
.br{display:grid;grid-template-columns:42% 1fr 54px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.br i{display:block;height:12px;background:var(--ac);border-radius:3px;min-width:2px}.br b{text-align:left}
@media print{nav,.b,.b2,.hb,.ed,.dl,.fl{display:none!important}header{background:#fff!important;color:#000;border-bottom:2px solid #000}body{background:#fff}}
.rw{display:flex;gap:6px;margin-bottom:6px}.rw input{flex:1}.sp{grid-column:1/-1}
</style></head><body><div id="app"></div>

const T=[['in','باحث من داخل الكلية',0],['out','باحث من خارج الكلية',0],['ioe','باحث من داخل الكلية ومن خارج مصر',0],['for','باحث أجنبي',1],['iof','باحث من داخل الكلية وباحث أجنبي',1]],K=['فردي','زوجي','مشترك'],S=['مخصص للتحكيم','جاري إجراء التعديلات','انتظار السداد','قبول البحث','رفض البحث'];

function nc(){return'P-'+String((db.seq||0)+1).padStart(4,'0')}

const tn=p=>T.find(t=>t[0]==p.type)[1],kn=p=>K[p.kind];

function calc(p){const f=db.cfg.fees[p.type]?.[p.kind];if(!f||f[0]==null)return null;const usd=T.find(t=>t[0]==p.type)[2];
const ex=Math.max(0,(+p.pages||0)-db.cfg.free)*(db.cfg.extra[p.type]||0),r=usd?+db.cfg.rate:1,pub=f[0]+ex,arb=f[1]||0;

const st=p=>calc(p)?(p.pdate?'مسدد':'غير مسدد'):'';

const dP=()=>({head:['كود البحث','عنوان البحث','الباحثون','نوع الباحث','نوع البحث','الصفحات','المجلد','العدد','تاريخ النشر','المحكّمون','السداد','حالة البحث','تاريخ السداد'],
rows:db.papers.map((p,i)=>[p.code,p.title,p.auth,tn(p),kn(p),p.pages,p.vol,p.iss,p.date,revs(p).join('، '),st(p),p.stat||S[0],p.pdate||''])});
const dI=()=>{const m={},mv={};db.papers.forEach(p=>{const k=p.vol+'|'+p.iss;(m[k]??={v:p.vol,i:p.iss,c:0,pg:0}).c++;m[k].pg+=+p.pages||0;mv[p.vol]=(mv[p.vol]||0)+1});
const a=Object.values(m).sort((x,y)=>(+x.v-+y.v)||(+x.i-+y.i));
return{head:['المجلد','العدد','عدد الأبحاث','إجمالي الصفحات'],rows:[...a.map(x=>[x.v,x.i,x.c,x.pg]),...Object.keys(mv).map(v=>['إجمالي المجلد '+v,'',mv[v],''])]}};
const dF=()=>{let t=0,q=0;const rows=db.papers.map((p,i)=>{const c=calc(p);if(!c)return[p.code,p.title,p.auth,tn(p),kn(p),p.pages,'غير متاح','','','','','','','',''];
t+=c.pubE+c.arbE;q+=c.ppE+c.apE;return[p.code,p.title,p.auth,tn(p),kn(p),p.pages,c.pub,c.arb,c.usd?'دولار':'جنيه',n2(c.pubE+c.arbE),p.pdate?c.pub:0,p.pdate?c.arb:0,n2(c.ppE+c.apE),st(p),p.pdate||'']});

const dR=()=>{const m={};db.papers.forEach(p=>{const c=calc(p),r=revs(p);if(!c||!r.length)return;r.forEach(x=>{(m[x]??={n:0,d:0}).n++;m[x].d+=c.apE*db.cfg.share/100/r.length})});
const a=Object.entries(m),rows=a.map(([k,v],i)=>[i+1,k,v.n,n2(v.d)]);
rows.push(['','الإجمالي',a.reduce((s,[,v])=>s+v.n,0),n2(a.reduce((s,[,v])=>s+v.d,0))]);

const dV=()=>{let a=0,b=0,pa=0,pb=0,du=0;db.papers.forEach(p=>{const c=calc(p);if(!c)return;a+=c.pubE;b+=c.arbE;pa+=c.ppE;pb+=c.apE;if(revs(p).length)du+=c.apE*db.cfg.share/100});

<label class="sp">عنوان البحث<input id="f_title" value="${esc(p.title)}"></label>
<div class="sp"><div class="nt">الباحثون: أضف كل باحث في خانة مستقلة</div>${lst('au',p.auth,'إضافة باحث')}</div>
<label>نوع الباحث<select id="f_type" onchange="pv()">${opt(T.map(t=>[t[0],t[1]]),p.type)}</select></label>
<label>نوع البحث (يتحدد من عدد الباحثين)<select id="f_kind" onchange="pv()">${opt(K.map((k,i)=>[i,k]),p.kind)}</select></label>
<label>عدد الصفحات<input id="f_pages" type="number" value="${p.pages}" oninput="pv()"></label>
<label>رسوم النشر (تلقائي)<input id="f_pub" readonly></label>
<label>رسوم التحكيم (تلقائي)<input id="f_arb" readonly></label>
<label>المجلد<input id="f_vol" value="${esc(p.vol)}"></label><label>العدد<input id="f_iss" value="${esc(p.iss)}"></label>
<label>تاريخ النشر<input id="f_date" type="date" value="${p.date}"></label>
<label>تاريخ السداد (يُعتبر البحث مسددًا عند إدخاله)<input id="f_pdate" type="date" value="${p.pdate||''}"></label>
<label>حالة البحث<select id="f_stat">${opt(S.map(x=>[x,x]),p.stat)}</select></label>
<div class="sp"><div class="nt">المحكّمون: أضف كل محكّم في خانة مستقلة</div>${lst('rv',p.revs,'إضافة محكّم')}</div></div>
<p class="nt" id="hint"></p>
<button class="b" onclick="sp()">${ed!=null?'حفظ التعديل':'إضافة البحث'}</button>${ed!=null?'<button class="b2" onclick="ed=null;render()">إلغاء</button>':''}
<h3>قائمة الأبحاث</h3><div class="g fl"><label>بحث (عنوان / باحث / محكّم)<input id="q" oninput="fp()"></label><label>حالة البحث<select id="qs" onchange="fp()"><option value="">الكل</option>${opt(S.map(x=>[x,x]),'')}</select></label><label>المجلد<input id="qv" oninput="fp()"></label><label>العدد<input id="qi" oninput="fp()"></label></div><div id="pl">${pl()}</div>`};
function pl(){const adm=me.r=='admin',a=dP(),q=($('#q')?.value||'').trim(),s=$('#qs')?.value||'',v=$('#qv')?.value.trim()||'',n=$('#qi')?.value.trim()||'',ix=[];
const rows=a.rows.filter((r,i)=>{const p=db.papers[i],ok=(!q||(p.code+p.title+p.auth+p.revs).includes(q))&&(!s||(p.stat||S[0])==s)&&(!v||p.vol==v)&&(!n||p.iss==n);if(ok)ix.push(i);return ok});
return`<p class="nt">عدد النتائج: ${rows.length} من ${db.papers.length}</p>`+tbl('p','الأبحاث',{head:a.head,rows},k=>{const i=ix[k];return`<button class="ed" onclick="ed=${i};render()">تعديل</button>${adm?`<button class="dl" onclick="if(confirm('حذف البحث؟')){db.papers.splice(${i},1);save();render()}">حذف</button>`:''}`})}
function fp(){$('#pl').innerHTML=pl()}
V.dash=()=>{const adm=me.r=='admin',P=db.papers,cnt=x=>P.filter(p=>(p.stat||S[0])==x).length,v=dV().rows,f=i=>v[i][1].toLocaleString('en');
const card=(l,n,g)=>`<div class="cd${g?' gd':''}"><b>${n}</b><span>${l}</span></div>`;
const bars=a=>{const m=Math.max(1,...a.map(x=>x[1]));return a.map(([l,n])=>`<div class="br"><span>${esc(l)}</span><i style="width:${n/m*100}%"></i><b>${n}</b></div>`).join('')||'<p class="nt">لا توجد بيانات</p>'};
const iss=dI().rows.filter(r=>!String(r[0]).startsWith('إجمالي')).map(r=>['مجلد '+r[0]+' - عدد '+r[1],r[2]]);
let h=`<div class="cards">${card('إجمالي الأبحاث',P.length)}${card('مقبولة',cnt(S[3]))}${card('مرفوضة',cnt(S[4]))}${card('مخصصة للتحكيم',cnt(S[0]))}${card('جاري التعديلات',cnt(S[1]))}${card('انتظار السداد',cnt(S[2]))}</div>`;
if(adm)h+=`<div class="cards">${card('إجمالي المطلوب (ج)',f(2),1)}${card('المحصّل (ج)',f(5),1)}${card('المتبقي (ج)',f(6),1)}${card('مستحقات المحكّمين (ج)',f(7),1)}${card('الصافي (ج)',f(8),1)}</div>`;
h+=`<div class="pg"><div class="pn"><h3>الأبحاث حسب العدد والمجلد</h3>${bars(iss)}</div><div class="pn"><h3>الأبحاث حسب الحالة</h3>${bars(S.map(x=>[x,cnt(x)]))}</div><div class="pn"><h3>الأبحاث حسب نوع الباحث</h3>${bars(T.map(t=>[t[1],P.filter(p=>p.type==t[0]).length]))}</div>`;
if(adm){const m={};P.forEach(p=>{const c=calc(p),d=(p.pdate||'').slice(0,7);if(c&&d)m[d]=(m[d]||0)+c.ppE+c.apE});h+=`<div class="pn"><h3>المحصّل شهريًا (جنيه)</h3>${bars(Object.keys(m).sort().map(k=>[k,n2(m[k])]))}</div>`}
const w=P.filter(p=>(p.stat||S[0])==S[2]);
h+=`<div class="pn"><h3>أبحاث في انتظار السداد (${w.length})</h3>${w.slice(0,6).map(p=>`<p class="nt">• ${esc(p.title)} — ${esc(p.auth)}</p>`).join('')||'<p class="nt">لا يوجد</p>'}</div>`;
if(adm)h+=`<div class="pn"><h3>أكثر المحكّمين تحكيمًا</h3>${bars(dR().rows.filter(r=>r[0]!=='').sort((a,b)=>b[2]-a[2]).slice(0,5).map(r=>[r[1],r[2]]))}</div>`;
return h+'</div>'};
const rw=(c,v)=>`<div class="rw"><input class="${c}" value="${esc(v)}"${c=='au'?' oninput="ak()"':''}><button type="button" class="dl" title="حذف" onclick="rm(this)">✖</button></div>`;
const lst=(c,str,t)=>{const a=(str||'').split(/[,،\n]/).map(x=>x.trim()).filter(Boolean);return`<div id="${c}l">${(a.length?a:['']).map(x=>rw(c,x)).join('')}</div><button type="button" class="b2" onclick="ad('${c}')">➕ ${t}</button>`};
function ad(c){$('#'+c+'l').insertAdjacentHTML('beforeend',rw(c,''));if(c=='au')ak()}
function rm(b){const d=b.parentNode;d.parentNode.children.length>1?d.remove():d.querySelector('input').value='';ak()}
function ak(){const n=[...document.querySelectorAll('.au')].filter(i=>i.value.trim()).length;if(n)$('#f_kind').value=Math.min(n,3)-1;pv()}
function pv(){const g=k=>$('#f_'+k).value,c=calc({type:g('type'),kind:+g('kind'),pages:+g('pages')||0});$('#f_pub').value=c?c.pub:'';$('#f_arb').value=c?c.arb:'';$('#hint').textContent=c?`الرسوم محسوبة من عدد الصفحات (${c.usd?'بالدولار':'بالجنيه'}): نشر ${c.pub} + تحكيم ${c.arb} = ${c.pub+c.arb}`:'هذه التركيبة غير متاحة في جدول الرسوم'}
function sp(){const g=k=>$('#f_'+k).value.trim(),l=c=>[...document.querySelectorAll('.'+c)].map(i=>i.value.trim()).filter(Boolean).join('، ');
const p={title:g('title'),auth:l('au'),type:g('type'),kind:+g('kind'),pages:+g('pages')||0,vol:g('vol'),iss:g('iss'),date:g('date'),revs:l('rv'),pdate:g('pdate'),stat:g('stat')};
if(!p.title||!p.auth)return alert('اكتب عنوان البحث وباحثًا واحدًا على الأقل');
if(!calc(p))return alert('هذه التركيبة غير متاحة في جدول الرسوم (باحث من داخل الكلية وأجنبي: بحث فردي).');
if(ed!=null){p.code=db.papers[ed].code;db.papers[ed]=p}else{p.code=nc();db.seq=(db.seq||0)+1;db.papers.push(p)}ed=null;save();render()}
V.issues=()=>`<h3>عدد الأبحاث في كل عدد ومجلد</h3>`+tbl('i','الأعداد_والمجلدات',dI());
V.fees=()=>`<h3>رسوم النشر والتحكيم المطلوبة من كل باحث</h3><p class="nt">الرسوم بعملتها الأصلية، والإجمالي محوَّل للجنيه حسب سعر الدولار في الإعدادات.</p>`+tbl('f','رسوم_الباحثين',dF());
V.rev=()=>`<h3>المبالغ المستحقة لكل محكّم</h3><p class="nt">المستحق = رسوم التحكيم للبحث (تُحتسب بعد إدخال تاريخ السداد) × نسبة التوزيع (في الإعدادات) ÷ عدد محكّمي البحث. فمع محكّمين اثنين يأخذ كل واحد النصف.</p>`+tbl('r','مستحقات_المحكّمين',dR());
V.money=()=>`<h3>الإيرادات والمصاريف</h3>`+tbl('v','الإيرادات',dV());
V.set=()=>{const c=db.cfg;return`<h3>إعدادات عامة</h3><div class="g">
<label>اسم المجلة<input value="${esc(c.name)}" onchange="db.cfg.name=this.value;save()"></label>
<label>سعر الدولار (جنيه)<input type="number" value="${c.rate}" onchange="db.cfg.rate=+this.value;save()"></label>
<label>الصفحات المشمولة قبل رسوم الصفحة الزائدة<input type="number" value="${c.free}" onchange="db.cfg.free=+this.value;save()"></label>
<label>نسبة رسوم التحكيم الموزعة على المحكّمين %<input type="number" value="${c.share}" onchange="db.cfg.share=+this.value;save()"></label></div>
<p class="nt">سعر الدولار (50) ونسبة التوزيع (100%) قيم مبدئية، عدّلها حسب الواقع. أي تعديل يحدّث كل التقارير تلقائيًا.</p>
<h3>جدول الرسوم (الدولار للباحث الأجنبي، والجنيه لغيره)</h3><div class="sc"><table><tr><th>نوع الباحث</th>${K.map(k=>`<th>${k}: نشر</th><th>${k}: تحكيم</th>`).join('')}<th>كل صفحة زائدة</th></tr>
${T.map(t=>`<tr><td>${t[1]} (${t[2]?'$':'ج'})</td>${K.map((k,j)=>[0,1].map(i=>`<td><input type="number" value="${c.fees[t[0]][j][i]??''}" onchange="sf('${t[0]}',${j},${i},this.value)"></td>`).join('')).join('')}<td><input type="number" value="${c.extra[t[0]]}" onchange="db.cfg.extra['${t[0]}']=+this.value;save()"></td></tr>`).join('')}</table></div>
<h3>المستخدمون</h3><div class="sc"><table>${db.users.map((u,i)=>`<tr><td>${esc(u.u)}</td><td>${u.r=='admin'?'مسؤول':'محرر'}</td><td><button class="dl" onclick="du(${i})">حذف</button></td></tr>`).join('')}</table></div>
<div class="g" style="margin-top:8px"><label>اسم المستخدم<input id="nu"></label><label>كلمة السر<input id="np"></label><label>الصلاحية<select id="nr"><option value="editor">محرر</option><option value="admin">مسؤول</option></select></label></div>
<button class="b" onclick="au()">إضافة / تحديث مستخدم</button><p class="nt">لتغيير كلمة سر مستخدم موجود اكتب اسمه وكلمة السر الجديدة.</p>
<h3>نسخة احتياطية</h3><button class="b2" onclick="dl(new Blob([JSON.stringify(db)],{type:'application/json'}),'journal_backup.json')">تنزيل نسخة احتياطية</button>
<label style="margin-top:8px">استعادة نسخة<input type="file" accept=".json" onchange="rs(this.files[0])"></label>
<p class="nt">البيانات محفوظة داخل المتصفح على هذا الجهاز. خذ نسخة احتياطية بانتظام.</p>`};
function sf(t,j,i,v){db.cfg.fees[t][j][i]=v===''?null:+v;save()}
function au(){const u=$('#nu').value.trim(),p=$('#np').value,r=$('#nr').value;if(!u||!p)return alert('اكتب اسم المستخدم وكلمة السر');const x=db.users.find(y=>y.u==u);
if(x&&x.r=='admin'&&r!='admin'&&db.users.filter(y=>y.r=='admin').length==1)return alert('لازم يفضل مسؤول واحد على الأقل');
x?(x.p=p,x.r=r):db.users.push({u,p,r});save();render()}
function du(i){const x=db.users[i];if(x.r=='admin'&&db.users.filter(y=>y.r=='admin').length==1)return alert('لا يمكن حذف المسؤول الوحيد');if(x.u==me.u)return alert('لا يمكنك حذف حسابك الحالي');db.users.splice(i,1);save();render()}
function rs(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.cfg||!d.papers||!d.users)throw 0;db=d;mig();save();me=null;render();alert('تمت الاستعادة، سجّل الدخول من جديد')}catch(e){alert('الملف غير صالح')}};r.readAsText(f)}
render();
</script></body></html>
